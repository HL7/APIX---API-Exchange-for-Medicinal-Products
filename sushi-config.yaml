id: hl7.fhir.uv.apix
canonical: http://hl7.org/fhir/uv/apix
name: ApixIG
title: Regulatory Workflows and Interactions - pharma
description: "Regulatory exchange is globally fragmented across authorities, product lines, procedures, and technologies. This IG establishes a common Task- and Subscription-based framework for regulatory workflows and interactions, enabling them to be exchanged, tracked, and acted upon with machine-readable status and event-driven notifications."
status: draft # draft | active | retired | unknown
extension:
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-wg  #<<< must include a http://hl7.org/fhir/StructureDefinition/structuredefinition-wg extension that identifies the workgroup responsible for the IG. This is the authoritative element.
    valueCode: brr
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-standards-status
    valueCode: trial-use
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm  #<<<<< this to to inform the publisher of the default FMM level for the artifacts in this IG
    valueInteger: 1
version: 0.1.0
fhirVersion: 5.0.0 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2025+
releaseLabel: ci-build
# license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
# license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
dependencies:
    hl7.fhir.uv.extensions:
        version: current
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World"

publisher:
  name: HL7 International / Biomedical Research and Regulation
  url: http://www.hl7.org/Special/committees/rcrim
