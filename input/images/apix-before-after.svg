<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Before and after RWI-pharma</title>
<desc id="d">Before: industry connects to each regulator with different exchange methods (email, secure email, FTP, AS2, HTTPS, portals, mail) that vary by product type, procedure, and country. After: industry uses one standardized FHIR API connection pattern with every regulator, regardless of product type, procedure, or country.</desc>
