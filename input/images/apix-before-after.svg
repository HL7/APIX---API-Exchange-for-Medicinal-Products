<text x="296" y="41" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2" fill="#fff">BEFORE: FRAGMENTED</text>
<text x="904" y="41" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2" fill="#fff">AFTER: ONE STANDARD</text>
